spring.application.name=BackEnd_Java
server.port=${PORT:8080}

# Comma-separated list of allowed frontend origins (set FRONTEND_ORIGINS in prod)
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://localhost:3000}

management.endpoints.web.exposure.include=health,info,booking-stats

management.endpoint.health.show-details=always

management.endpoints.web.cors.allowed-origins=${app.cors.allowed-origins:http://localhost:5173,http://localhost:3000}
management.endpoints.web.cors.allowed-methods=GET,POST,OPTIONS
management.endpoints.web.cors.allowed-headers=*
management.endpoints.web.cors.allow-credentials=true


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.profiles.active=${SPRING_PROFILE:local}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}

# Google OAuth
spring.security.oauth2.client.registration.google.client-id=${CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${CLIENT_KEY}
spring.security.oauth2.client.registration.google.scope=profile,email


# Enable schema and data initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true



#Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

# JWT
jwt.secret=${JWT_SECRET}
